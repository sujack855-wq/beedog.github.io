</head>

    <div class="bee-cursor" id="beeCursor" aria-hidden="true">🐝</div>

    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="index.html"><span class="brand-icon">🐝</span><span class="brand-text">BeeDog</span></a></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我</a></li>
                <li><a href="portfolio.html">作品集</a></li>
                <li><a href="blog.html">博客</a></li>
                <li><a href="books.html">最近在看的书</a></li>
                <li><a href="travel.html">我去过的地方</a></li>
                <li><a href="now.html">NOW</a></li>
                <li><a href="game.html">🎮</a></li>
                <li><a href="guestbook.html" class="active">留言板</a></li>
                <li><a href="contact.html">联系方式</a></li>
            </ul>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title">💾 访客留言板</h1>
            <p class="page-subtitle">SAVE FILE · 本地存档</p>
        </div>
    </section>

    <section style="padding: 40px 0 100px;">
        <div class="container">
            <div class="gb-wrap">
                <!-- 存档机 -->
                <div class="gb-console">
                    <h3>▼ CREATE NEW SAVE</h3>
                    <div class="gb-form">
                        <label>PLAYER NAME · 名字</label>
                        <input id="gbName" maxlength="20" placeholder="勇者的名字..." />

                        <label>MESSAGE · 留言</label>
                        <textarea id="gbMsg" rows="4" maxlength="280" placeholder="在这里留下你的冒险记录..."></textarea>

                        <div class="gb-meta">
                            <span>EMOJI:</span>
                            <div class="gb-emojis" id="gbEmojis">
                                <button type="button" class="gb-emoji active" data-emj="🐝">🐝</button>
                                <button type="button" class="gb-emoji" data-emj="👾">👾</button>
                                <button type="button" class="gb-emoji" data-emj="⭐">⭐</button>
                                <button type="button" class="gb-emoji" data-emj="🍯">🍯</button>
                                <button type="button" class="gb-emoji" data-emj="🎮">🎮</button>
                                <button type="button" class="gb-emoji" data-emj="🤖">🤖</button>
                                <button type="button" class="gb-emoji" data-emj="☕">☕</button>
                                <button type="button" class="gb-emoji" data-emj="🔥">🔥</button>
                            </div>
                        </div>
                        <button class="gb-submit" id="gbSubmit">▶ SAVE</button>
                    </div>
                    <div class="gb-local-note">
                        ⓘ 留言仅保存在你自己的浏览器里(localStorage) · 刷新后依然存在 · 别人看不到
                    </div>
                </div>

                <!-- 留言列表 -->
                <div class="gb-list">
                    <h3>★ SAVE FILES · <span id="gbCount">0</span> 条留言</h3>
                    <div id="gbMessages"></div>
                    <div style="text-align:center; margin-top:16px;">
                        <button class="btn btn-secondary" id="gbClear" style="font-size:10px; padding:8px 14px;">🗑 清空所有存档</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand"><span class="brand-icon">🐝</span><span class="brand-text">BeeDog</span></div>
                <p class="footer-description">蜜蜂狗BeeDog的说明书</p>
                <p class="footer-copyright">© 2025 苏笔辉</p>
            </div>
        </div>
    </footer>

    <button class="secret-star" id="secretStar" aria-label="神秘星星">✦</button>
    <div class="toast" id="toast"></div>

    <script src="js/main.js"></script>
    <script src="js/effects.js"></script>
    <script>
    (function(){
        const KEY = 'beedog_guestbook';
        const emojis = document.getElementById('gbEmojis');
        let selEmoji = '🐝';
        emojis.addEventListener('click', e => {
            const b = e.target.closest('.gb-emoji');
            if (!b) return;
            emojis.querySelectorAll('.gb-emoji').forEach(x=>x.classList.remove('active'));
            b.classList.add('active');
            selEmoji = b.dataset.emj;
        });

        const load = () => { try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch { return []; } };
        const save = arr => localStorage.setItem(KEY, JSON.stringify(arr));

        const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const fmt = t => {
            const d = new Date(t);
            const p = n => String(n).padStart(2,'0');
            return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        };

        const render = () => {
            const list = load().sort((a,b)=>b.time-a.time);
            const box = document.getElementById('gbMessages');
            document.getElementById('gbCount').textContent = list.length;
            if (list.length === 0) {
                // 默认示例留言
                box.innerHTML = `
                    <div class="gb-msg">
                        <div class="gb-msg-head">
                            <div class="gb-msg-name"><span class="emj">🐝</span>BeeDog 管理员</div>
                            <div class="gb-msg-time">DEMO</div>
                        </div>
                        <div class="gb-msg-body">欢迎来到我的存档机!👾 留下一句话或者一个 emoji 就好。这里的留言只存在你自己的浏览器里,可以放心写。</div>
                    </div>
                    <div class="gb-msg-empty">▼ 你是第一位访客 ▼</div>
                `;
                return;
            }
            box.innerHTML = list.map(m => `
                <div class="gb-msg">
                    <div class="gb-msg-head">
                        <div class="gb-msg-name"><span class="emj">${esc(m.emj||'🐝')}</span>${esc(m.name||'匿名勇者')}</div>
                        <div class="gb-msg-time">${fmt(m.time)}</div>
                    </div>
                    <div class="gb-msg-body">${esc(m.msg)}</div>
                </div>
            `).join('');
        };

        document.getElementById('gbSubmit').addEventListener('click', () => {
            const name = document.getElementById('gbName').value.trim() || '匿名勇者';
            const msg  = document.getElementById('gbMsg').value.trim();
            if (!msg) {
                window.BeeDogToast && window.BeeDogToast('留言不能为空!');
                return;
            }
            const arr = load();
            arr.push({ name, msg, emj: selEmoji, time: Date.now() });
            save(arr);
            document.getElementById('gbMsg').value = '';
            window.BeeDogToast && window.BeeDogToast('★ SAVE COMPLETE! +5 EXP');
            window.BeeDogAddScore && window.BeeDogAddScore(5);
            window.BeeDogRain && window.BeeDogRain(12);
            render();
        });

        document.getElementById('gbClear').addEventListener('click', () => {
            if (confirm('确定要删除所有留言吗? 这个操作不可撤销。')) {
                localStorage.removeItem(KEY);
                render();
                window.BeeDogToast && window.BeeDogToast('存档已清空');
            }
        });

        render();
    })();
    </script>
</body>
</html>
