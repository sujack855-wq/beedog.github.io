    <nav class="navbar">

            <div class="nav-brand"><a href="index.html"><span class="brand-icon">🐝</span><span class="brand-text">BeeDog</span></a></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">首页</a></li>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title">📚 最近在看的书</h1>
            <p class="page-subtitle">INVENTORY · 道具栏</p>
        </div>
    </section>

    <section style="padding: 40px 0 100px;">
        <div class="container">
            <div class="inventory-wrap">
                <div class="inventory-filters">
                    <button class="inv-tab active" data-filter="all">全部</button>
                    <button class="inv-tab" data-filter="reading">在读</button>
                    <button class="inv-tab" data-filter="done">通关</button>
                    <button class="inv-tab" data-filter="wish">愿望</button>
                    <span style="margin-left:auto; color:var(--text-muted); align-self:center; font-size:10px;">
                        <span id="bookCount">0</span> / <span id="bookTotal">0</span> 本
                    </span>
                </div>
                <div class="inventory-grid" id="inventoryGrid"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand"><span class="brand-icon">🐝</span><span class="brand-text">BeeDog</span></div>
                <p class="footer-description">蜜蜂狗BeeDog的说明书</p>
                <p class="footer-copyright">© 2025 苏笔辉 · GAME OVER? INSERT COIN TO CONTINUE</p>
            </div>
        </div>
    </footer>

    <button class="secret-star" id="secretStar" aria-label="神秘星星">✦</button>
    <div class="toast" id="toast"></div>

    <script src="js/main.js"></script>
    <script src="js/effects.js"></script>
    <script>
    const BOOKS = [
        { id:'seven-habits', title:'高效能人士的七个习惯', author:'史蒂芬·柯维', status:'reading', cover:'📘', stars:4, progress:35,
          tag:'自我管理', note:'从"被动→主动"到"统合综效"的七阶成长地图' },
        { id:'courage', title:'被讨厌的勇气', author:'岸见一郎 / 古贺史健', status:'reading', cover:'🧭', stars:5, progress:60,
          tag:'阿德勒心理学', note:'哲人与青年五个夜晚的对谈' },
        { id:'atomic', title:'原子习惯', author:'詹姆斯·克利尔', status:'done', cover:'⚛️', stars:5, progress:100,
          tag:'习惯养成', note:'1% 的复利效应', link:'book-note-atomic-habits.html' },
        { id:'crucial', title:'关键对话', author:'Kerry Patterson 等', status:'done', cover:'💬', stars:4, progress:100,
          tag:'沟通', note:'如何在高风险对话中保持坦诚', link:'book-note-crucial-conversations.html' },
        { id:'pyramid', title:'金字塔原理', author:'芭芭拉·明托', status:'done', cover:'🔺', stars:5, progress:100,
          tag:'思考表达', note:'结论先行 · MECE · 自上而下' },
        { id:'wish-1', title:'???', author:'下一本书', status:'wish', cover:'❓', stars:0, progress:0,
          tag:'待解锁', note:'' },
    ];

    const starsHtml = n => '<span class="inv-stars">' +
        '★'.repeat(n) + '<span class="dim">' + '★'.repeat(Math.max(0,5-n)) + '</span></span>';

    const statusBadge = s => {
        if (s === 'reading') return '<span class="inv-badge new">READING</span>';
        if (s === 'done')    return '<span class="inv-badge done">CLEAR</span>';
        if (s === 'wish')    return '<span class="inv-badge">WISH</span>';
        return '';
    };

    const render = (filter='all') => {
        const grid = document.getElementById('inventoryGrid');
        const list = filter === 'all' ? BOOKS : BOOKS.filter(b => b.status === filter);
        // 补齐到最接近 12 的倍数（空格子）
        const slotCount = Math.max(12, Math.ceil(list.length / 6) * 6);
        const empties = slotCount - list.length;

        grid.innerHTML = list.map(b => {
            const href = b.link ? b.link : 'javascript:void(0)';
            const click = b.link ? '' : 'onclick="showBook(\''+b.id+'\')"';
            return `
            <a href="${href}" class="inv-slot js-clickable" data-id="${b.id}" ${click}>
                ${statusBadge(b.status)}
                <div class="inv-cover">${b.cover}</div>
                <div>
                    <div class="inv-title">${b.title}</div>
                    <div class="inv-meta"><span>${b.author || '—'}</span>${starsHtml(b.stars)}</div>
                    <div class="inv-hp"><span style="width:${b.progress}%"></span></div>
                </div>
            </a>`;
        }).join('') +
        Array.from({length: empties}).map(() =>
            `<div class="inv-slot empty"><div class="inv-cover" style="color:var(--text-muted);font-size:28px;">?</div><div><div class="inv-title" style="color:var(--text-muted)">待解锁</div><div class="inv-meta"><span>—</span></div></div></div>`
        ).join('');

        document.getElementById('bookCount').textContent = list.length;
        document.getElementById('bookTotal').textContent = BOOKS.length;
    };

    window.showBook = id => {
        const b = BOOKS.find(x => x.id === id);
        if (!b || !b.note) return;
        window.BeeDogToast && window.BeeDogToast('《'+b.title+'》 · '+b.note, 3200);
    };

    document.querySelectorAll('.inv-tab').forEach(t => {
        t.addEventListener('click', () => {
            document.querySelectorAll('.inv-tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            render(t.dataset.filter);
        });
    });

    render();
    </script>
</body>
</html>
