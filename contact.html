    <!-- 页面标题 -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title">联系方式</h1>
            <p class="page-subtitle">Contact</p>
            <p class="page-description">期待与你交流与合作</p>
        </div>
    </section>

    <!-- 联系内容 -->
    <section class="contact-section">
        <div class="container">
            <div class="contact-grid">
                <!-- 联系表单 -->
                <div class="contact-form-wrapper">
                    <h2 class="form-title">写一封邮件</h2>
                    <p class="contact-note">填写后会打开你的邮件应用，内容会带入草稿。请在邮件应用中确认发送；本站不会直接提交消息。也可以复制右侧邮箱联系我。</p>
                    <form class="contact-form" onsubmit="handleSubmit(event)">
                        <div class="form-group">
                            <label for="name">姓名 *</label>
                            <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱 *</label>
                            <input type="email" id="email" name="email" required placeholder="请输入您的邮箱">
                        </div>
                        <div class="form-group">
                            <label for="subject">主题</label>
                            <input type="text" id="subject" name="subject" placeholder="请输入消息主题">
                        </div>
                        <div class="form-group">
                            <label for="message">留言 *</label>
                            <textarea id="message" name="message" rows="6" required placeholder="请输入您的留言内容..."></textarea>
                        </div>
                        <button type="submit" class="submit-btn">
                            <span>打开邮件应用</span>
                            <span class="btn-icon">→</span>
                        </button>
                    </form>
                </div>

                <!-- 联系信息 -->
                <div class="contact-info-wrapper">
                    <h2 class="info-title">联系信息</h2>

                    <div class="contact-info-item">
                        <div class="contact-icon">📧</div>
                        <div class="contact-details">
                            <h3>邮箱</h3>
                            <a href="mailto:s1870567841@163.com">s1870567841@163.com</a>
                        </div>
                    </div>

                    <div class="contact-info-item">
                        <div class="contact-icon">📱</div>
                        <div class="contact-details">
                            <h3>电话</h3>
                            <a href="tel:19357505597">19357505597</a>
                        </div>
                    </div>

                    <div class="contact-info-item">
                        <div class="contact-icon">📍</div>
                        <div class="contact-details">
                            <h3>位置</h3>
                            <p>成都，中国</p>
                        </div>
                    </div>

                    <div class="contact-divider"></div>

                    <div class="quick-links">
                        <h3>快速链接</h3>
                        <div class="link-grid">
                            <a href="index.html" class="quick-link-item">
                                <span class="link-icon">🏠</span>
                                <span>首页</span>
                            </a>
                            <a href="about.html" class="quick-link-item">
                                <span class="link-icon">👤</span>
                                <span>关于我</span>
                            </a>
                            <a href="portfolio.html" class="quick-link-item">
                                <span class="link-icon">💼</span>
                                <span>作品集</span>
                            </a>
                            <a href="blog.html" class="quick-link-item">
                                <span class="link-icon">📝</span>
                                <span>博客</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->


    <script>
        // 表单提交处理
        function handleSubmit(event) {
            event.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            const subject = formData.subject.trim() || '来自 BeeDog 网站的联系';
            const body = `姓名：${formData.name}\n回复邮箱：${formData.email}\n\n${formData.message}`;
            window.location.href = 'mailto:s1870567841@163.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

        }


    </script>
